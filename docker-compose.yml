version: "3.9"
services:
  db:
    # Uncomment the line below if using Mac M
    # platform: linux/x86_64
    image: mysql:5.7
    restart: always
    command: --max_allowed_packet=32505856
    environment:
      # Password for root access
      MYSQL_ROOT_PASSWORD: 'password'
    ports:
      # <Port exposed> : < MySQL Port running inside container>
      - '3308:3306'
    # Where our data will be persisted
    volumes:
      - my-db:/var/lib/mysql
  solr:
    image: solr:6.1.0
    ports:
      - "8983:8983"
    volumes:
      - solr_data:/opt/solr/server/solr/mycores
    entrypoint:
      - docker-entrypoint.sh
      - solr-precreate
      - development
    depends_on:
      - db
volumes:
  my-db:
  solr_data:
