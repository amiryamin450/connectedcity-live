upstream unicorn {
  server unix:/tmp/unicorn.connectbook.sock fail_timeout=0;
}

server {
  listen 80;
  server_name connectedcity.tv *.connectedcity.tv connectedbook.tv *.connectedbook.tv camidoo.home *.camidoo.home cc.camidoo.ddns.me *.cc.camidoo.ddns.me;
  root /home/clewis/apps/connectbook/current/public;

  location ^~ /assets/ {
    gzip_static on;
    expires max;
    add_header Cache-Control public;
  }

  try_files $uri/index.html $uri @unicorn;
  location @unicorn {
    auth_basic "development";
    auth_basic_user_file .htpasswd;
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_redirect off;
    proxy_pass http://unicorn;
  }

  error_page 500 502 503 504 /500.html;
  client_max_body_size 4G;
  keepalive_timeout 10;
}
